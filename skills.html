<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills | Edrine</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600&display=swap');

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        html{
            font-size: 62.5%;
        }

        body{
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header{
            margin-top: 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem 9%;
            background-color: transparent;
            filter: drop-shadow(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .logo{
            font-size: 3rem;
            color: #b74b4b;
            font-weight: 800;
            cursor: pointer;
            transition: 0.5s ease;
        }

        .logo:hover{
            transform: scale(1.1);
        }

        nav a{
            font-size: 1.8rem;
            color: white;
            margin-left: 4rem;
            font-weight: 500;
            transition: 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        nav a:hover,
        nav a.active{
            color: #b74b4b;
            border-bottom: 3px solid #b74b4b;
        }

        @media(max-width:995px){
            nav{
                position: absolute;
                display: none;
                top: 0;
                right: 0;
                width: 40%;
                border-left: 3px solid #b74b4b;
                border-bottom: 3px solid #b74b4b;
                border-bottom-left-radius: 2rem;
                padding: 1rem solid;
                background-color: #161616;
                border-top: 0.1rem solid rgba(0,0,0,0.1);
            }

            nav.active{
                display: block;
            }

            nav a{
                display: block;
                font-size: 2rem;
                margin: 3rem 0;
            }

            nav a:hover,
            nav a.active{
                padding: 1rem;
                border-radius: 0.5rem;
                border-bottom: 0.5rem solid #b74b4b;
            }
        }

        h1 { margin: 0; }

        section{
            min-height: 100vh;
            padding: 5rem 9% 5rem;
            max-width: 100%;
            margin: auto;
        }

        .card {
            background: #161616;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .home{
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            gap: 8rem;
            background-color: black;
        }

        .home .home-content h1{
            font-size: 6rem;
            font-weight: 700;
            line-height: 1.3;
        }

        span{
            color: #b74b4b;
        }

        .skills span {
            display: inline-block;
            background: #334155;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        .home-content h3{
            font-size: 4rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .home-content p{
            font-size: 1.6rem;
        }

        .home-img{
            border-radius: 50%;
        }

        .home-img img{
            position: relative;
            width: 32vw;
            border-radius: 50%;
            box-shadow: 0 0 25px solid #b74b4b;
            cursor: pointer;
            transition: 0.2s linear;
        }

        .home-img img:hover{
            font-size: 1.8rem;
            font-weight: 500;
        }

        .social-icons a{
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 4rem;
            height: 4rem;
            background-color: transparent;
            border: 0.2rem solid #b74b4b;
            font-size: 2rem;
            border-radius: 50%;
            margin: 3rem 1.5rem 3rem 0;
            transition: 0.3s ease;
            color: #b74b4b;
        }

        .social-icons a:hover{
            color: black;
            transform: scale(1.3) translateY(-5px);
            background-color: #b74b4b;
            box-shadow: 0  0 25px #b74b4b;
        }

        .btn{
            display: inline-block;
            padding: 1rem 2.8rem;
            background-color: black;
            border-radius: 4rem;
            font-size: 1.6rem;
            color: #b74b4b;
            letter-spacing: 0.3rem;
            font-weight: 600;
            border: 2px solid #b74b4b;
            transition: 0.3s ease;
            cursor: pointer;
        }

        .btn:hover{
            transform: scale3d(1.03);
            background-color: #b74b4b;
            color: black;
            box-shadow: 0 0 25px #b74b4b;
        }

        .typing-text{
            font-size: 10px;
            font-weight: 600;
            min-width: 280px;
        }

        .typing-text span{
            position: relative;
        }

        .typing-text span::before{
            content: "software Developer";
            color: #b74b4b;
            animation: words 20s infinite;
        }

        .typing-text span::after{
            content: "";
            background-color: black;
            position: absolute;
            width: calc(100% + 8px);
            height: 100%;
            border-left: 3px solid black;
            right: -8;
            animation: cursor 0.4s infinite;
        }

        @keyframes cursor{
            to{
                border-left: 3px solid #b74b4b;
            }
        }

        @keyframes words{
            0%, 20%{
                content: "Web Developer";
            }
            21%, 40%{
                content: "Programmer";
            }
            41%, 60%{
                content: "Tech-Support Lead";
            }
            61%, 80%{
                content: "Data Analyst";
            }
            81%, 100%{
                content: "Area Supervisor";
            }
        }

        @media (max-width: 1000px){
            .home{
                gap: 4rem;
            }
        }

        @media(max-width:995px){
            .home{
                flex-direction: column;
                margin: 5rem 4rem;
            }

            .home .home-content h3{
                font-size: 2.5rem;
            }

            .home-content h1{
                font-size: 5rem;
            }

            .home-img img{
                width: 70vw;
                margin-top: 4rem;
            }
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #020617;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">Edrine</a>

        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="skills.html">Skills</a>
            <a href="education.html">Education</a>
            <a href="experience.html">Experience</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <section>
        <h2>My Skills</h2>

        <div class="skills">

            <div class="skill-item">
                <img src="images/php.png" alt="PHP">
                <p>PHP</p>
            </div>

            <div class="skill-item">
                <img src="images/laravel.png" alt="Laravel">
                <p>Laravel</p>
            </div>

            <div class="skill-item">
                <img src="images/mysql.png" alt="MySQL">
                <p>MySQL</p>
            </div>

            <div class="skill-item">
                <img src="images/js.png" alt="JavaScript">
                <p>JavaScript</p>
            </div>

            <div class="skill-item">
                <img src="images/html.png" alt="HTML">
                <p>HTML</p>
            </div>

            <div class="skill-item">
                <img src="images/css.png" alt="CSS">
                <p>CSS</p>
            </div>

            <div class="skill-item">
                <img src="images/python.png" alt="Python">
                <p>Python</p>
            </div>

        </div>
    </section>

    <br><br>


</body>
</html>
